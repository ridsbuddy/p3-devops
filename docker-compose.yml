services:
  api:
    image: ghcr.io/ridsbuddy/book-inventory-api:latest
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_NAME: booksdb
      DB_USER: bookuser
      DB_PASSWORD: bookpass
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  postgres_data:



