services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_NAME: booksdb
      DB_USER: bookuser
      DB_PASSWORD: bookpass
    depends_on:
      - database  

   database:
    image: postgres:16
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

    volumes:
       postgres_data:
