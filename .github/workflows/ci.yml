name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: | 
          pip install -r requirements.txt

      - name: Debug test File
        run: |
          cat tests/test_app.py

      - name: Run Tests
        run: |
          python -m pytest

  build:
     needs: test
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Check Build Files
         run: |
          pwd
          ls -la

       - name: Build Docker image
         run: |
           docker build -t book-inventory-api .
